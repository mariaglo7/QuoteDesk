<!doctype html>
<!-- Code written with help from Claude (Anthropic) -->
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Oferta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap">
<style>
  :root { --ink: #1E1613; --muted: #6F625C; --line: #E8E3E0; --pink: #FF7AE5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font-family: "Poppins", system-ui, sans-serif; font-weight: 300; line-height: 1.5; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 20px 72px; display: grid; gap: 28px; }
  h1 { font-size: clamp(32px, 7vw, 46px); font-weight: 600; line-height: 1.1; margin: 0; }
  h2 { font-size: 22px; font-weight: 600; margin: 0 0 10px; }
  .dot { color: var(--pink); }
  .muted { color: var(--muted); margin: 6px 0 0; }
  .row { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid var(--line); }
  .row b { font-weight: 600; white-space: nowrap; }
  .row s { color: var(--muted); font-weight: 300; margin-right: 8px; }
  .tag { background: var(--pink); border-radius: 99px; font-size: 12px; font-weight: 500; padding: 1px 9px; margin-left: 8px; white-space: nowrap; }
  button { font: inherit; font-weight: 500; background: var(--ink); color: #fff; border: 0; border-radius: 10px; padding: 13px 22px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  button:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
  .box { background: var(--ink); color: #fff; border-radius: 12px; padding: 22px; display: grid; gap: 12px; justify-items: start; }
  .box button { background: var(--pink); color: var(--ink); }
  .box p { margin: 0; }
</style>
</head>
<body>
<main id="offer"><p>…</p></main>
<script type="module" src="offer-page.js"></script>
</body>
</html>
